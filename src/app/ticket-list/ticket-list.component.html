<!-- Location Selector (Populated from Bus Model) -->
<div class="mb-4">
  <label class="block text-gray-700 text-sm font-bold mb-2" for="location">
    Location
  </label>
  <select
    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
    id="location"
    [(ngModel)]="selectedLocation"
    (ngModelChange)="filterBusData()"

  >
    <option *ngFor="let bus of bus" [value]="bus.departureFrom">
      {{ bus.departureFrom }}
    </option>
  </select>
</div>

<!-- Departure Selector (Populated from Bus Model) -->
<div class="mb-6">
  <label class="block text-gray-700 text-sm font-bold mb-2" for="departure">
    Departure
  </label>
  <select
    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
    id="departure"
    [(ngModel)]="selectedDeparture"
    (ngModelChange)="filterBusData()"

  >
    <option *ngFor="let bus of bus" [value]="bus.destination">
      {{ bus.destination }}
    </option>
  </select>
</div>

<!-- Date Input -->
<div class="mb-6">
  <label class="block text-gray-700 text-sm font-bold mb-2" for="date">
    Date
  </label>
  <input
    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
    id="date"
    type="date"
    [(ngModel)]="selectedDate"
    [min]="minDate"
    (ngModelChange)="filterBusData()"

  />
</div>
<a
  href="#"
  class="relative block overflow-hidden rounded-lg border border-gray-100 p-4 sm:p-6 lg:p-8 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"
  *ngFor="let bus of filteredBus"
>
  <span
    class="absolute inset-x-0 bottom-0 h-2 bg-gradient-to-r from-green-300 via-blue-500 to-purple-600"
  ></span>

  <div class="sm:flex sm:justify-between sm:gap-4">
    <div>
      <h3 class="text-lg font-bold text-gray-900 sm:text-xl">
        {{ bus.busNo }} - {{ bus.model }}
      </h3>

      <p class="mt-1 text-xs font-medium text-gray-600">
        Departure: {{ bus.departureFrom }} - Destination: {{ bus.destination }}
      </p>
    </div>

    <div class="hidden sm:block sm:shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bus-front-fill" viewBox="0 0 16 16">
        <path d="M16 7a1 1 0 0 1-1 1v3.5c0 .818-.393 1.544-1 2v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5V14H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2a2.5 2.5 0 0 1-1-2V8a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1V2.64C1 1.452 1.845.408 3.064.268A44 44 0 0 1 8 0c2.1 0 3.792.136 4.936.268C14.155.408 15 1.452 15 2.64V4a1 1 0 0 1 1 1zM3.552 3.22A43 43 0 0 1 8 3c1.837 0 3.353.107 4.448.22a.5.5 0 0 0 .104-.994A44 44 0 0 0 8 2c-1.876 0-3.426.109-4.552.226a.5.5 0 1 0 .104.994M8 4c-1.876 0-3.426.109-4.552.226A.5.5 0 0 0 3 4.723v3.554a.5.5 0 0 0 .448.497C4.574 8.891 6.124 9 8 9s3.426-.109 4.552-.226A.5.5 0 0 0 13 8.277V4.723a.5.5 0 0 0-.448-.497A44 44 0 0 0 8 4m-3 7a1 1 0 1 0-2 0 1 1 0 0 0 2 0m8 0a1 1 0 1 0-2 0 1 1 0 0 0 0 2 0m-7 0a1 1 0 0 0 1 1h2a1 1 0 1 0 0-2H7a1 1 0 0 0-1 1"/>
      </svg>
      
    </div>
  </div>

  <div class="mt-4">
    <p class="text-pretty text-sm text-gray-500">
      Date: {{ bus.date }} - Price: {{ bus.price }}
    </p>
  </div>

  <dl class="mt-6 flex gap-4 sm:gap-6">
    <div class="flex flex-col-reverse">
      <dt class="text-sm font-medium text-gray-600">Departure Time</dt>
      <dd class="text-xs text-gray-500">{{ bus.departure }}</dd>
    </div>

    <div class="flex flex-col-reverse">
      <dt class="text-sm font-medium text-gray-600">Amenities</dt>
      <dd class="text-xs text-gray-500">{{ bus.amenities }}</dd>
    </div>
  </dl>
  <div class="flex justify-between items-center">
    <a  [routerLink]="['/dashboard/bookticket', bus.id]" class="text-white font-semibold text-sm hover:underline flex items-center">
      Book Ticket
      <svg xmlns="http://www.w3.org/2000/svg" class="ml-2 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    </a>
  </div>
</a>

<!-- Display Message if No Bus Trip is Found -->
<div *ngIf="filteredBus.length === 0 && isSubmitted" class="mt-6">
  <p class="text-red-500">No bus trip available for the selected criteria.</p>
</div>
